source = ~/.config/hypr/colors/colors.conf

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
    no_fade_out = false
}

# --- SCREEN BACKGROUND ---
background {
    monitor =
    path = screenshot
    
    blur_passes = 4
    blur_size = 12
    noise = 0.02
    contrast = 0.95
    brightness = 0.35
    vibrancy = 0.3
    vibrancy_darkness = 0.2
}

# Ambient Dark Vignette overlay
shape {
    monitor =
    size = 9999, 9999
    color = $bg_dim
    position = 0, 0
    halign = center
    valign = center
}

# --- HERO CLOCK ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $text_main
    font_size = 110
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 110
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.6)
}

# --- DATE DISPLAY ---
label {
    monitor =
    text = cmd[update:60000] echo "$(LC_TIME=en_US.UTF-8 date +'%A, %d %B' | tr '[:lower:]' '[:upper:]')"
    color = $text_sub
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, 15
    halign = center
    valign = center
}

# --- USERNAME / STATUS LINE ---
label {
    monitor =
    text = 󰌾 LOCKED AS <b>$USER</b>
    color = $user_text
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# --- HIDDEN UNTIL TYPED PASSWORD PILL ---
input-field {
    monitor =
    size = 220, 36
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1
    rounding = 18

    outer_color = $accent_blue
    inner_color = $pill_bg
    font_color = $text_main

    check_color = $success_clr
    fail_color = $fail_clr
    fail_text = <i>Authentication Failed</i>
    fail_transition = 150

    placeholder_text = <span foreground="##a6adc8">Type password...</span>
    hide_input = false

    fade_on_empty = true
    fade_timeout = 0

    position = 0, -110
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.4)
}

# --- BATTERY INDICATOR ---
label {
    monitor =
    text = cmd[update:5000] echo "$(upower -i $(upower -e | grep BAT | head -n 1) | awk '/state/ {state=$2} /percentage/ {pct=$2} END {if (state=="charging") print "󰂄 " pct; else print "󰁹 " pct}')"
    color = $battery_clr
    font_size = 9
    font_family = JetBrainsMono Nerd Font
    position = 0, 25
    halign = center
    valign = bottom
}