# Global Settings
# Sets the absolute maximum gamma allowed (Up to 200%)
max-gamma = 150

# Profile: Daytime (7:30 AM)
# "identity = true" turns off the blue-light filter entirely (normal colors)
[profile 07:30]
identity = true

# Profile: Evening (6:00 PM / 18:00)
# A moderate warm tint with slightly reduced gamma
[profile 18:00]
temperature = 4500
gamma = 0.9

# Profile: Nighttime (9:00 PM / 21:00)
# A deeper warm tint for pitch-black rooms
[profile 21:00]
temperature = 3500
gamma = 0.8